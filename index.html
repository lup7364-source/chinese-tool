<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>中文練習</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div id="app">
    <header class="card bar">
      <div class="brand"><span class="logo">中</span><span>中文練習</span></div>
      <span id="dateLabel" class="chip"></span>
    </header>

    <nav id="tabs"></nav>

    <main id="stage" class="card">載入中…</main>

    <div id="stepbar">
      <button id="prevStep" class="btn ghost">上一步</button>
      <button id="nextStep" class="btn primary">下一步</button>
    </div>

    <!-- 管理區：按下方「管理」顯示，再按一次隱藏 -->
    <div id="admin" hidden>
      <div class="card" id="loginBox">
        <h2>管理員登入</h2>
        <input id="email" type="email" placeholder="電子郵件">
        <input id="password" type="password" placeholder="密碼">
        <button id="loginBtn" class="btn primary">登入</button>
      </div>

      <div class="card" id="addBox" hidden>
        <h2>新增單字</h2>
        <textarea id="raw" rows="14" placeholder="貼上單字內容（Character、Pinyin、Meaning、Usage、Example、Common expressions related、Questions to practice）"></textarea>
        <button id="analyzeBtn" class="btn primary">分析</button>
        <div id="preview"></div>
        <button id="saveBtn" class="btn primary" hidden>儲存到資料庫</button>
        <button id="logoutBtn" class="btn ghost">登出</button>
        <p id="adminStatus"></p>
      </div>
    </div>

    <footer><a href="#admin" id="adminToggle">管理</a></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
